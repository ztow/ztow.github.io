<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵兄休得胡言 · ztow</title>
<meta name="description" content="赵伟（ztow）的个人主页：开源项目与近期文章。">
<style>
:root {
  --bg: #fbfaf8;
  --ink: #16161a;
  --ink-2: #55555f;
  --ink-3: #8f8f99;
  --line: rgba(0, 0, 0, 0.09);
  --line-2: rgba(0, 0, 0, 0.16);
  --hover: #b4441f;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
  --serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC",
           Georgia, "Times New Roman", serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Cascadia Mono",
          "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0f;
    --ink: #f0efec;
    --ink-2: #a2a2ab;
    --ink-3: #6e6e78;
    --line: rgba(255, 255, 255, 0.1);
    --line-2: rgba(255, 255, 255, 0.2);
    --hover: #e8794c;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.75;
  padding: 88px 40px 72px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.wrap { max-width: 1120px; margin: 0 auto; }

/* ── 标识区 ── */
.masthead { margin-bottom: 72px; }

h1 {
  font-family: var(--serif);
  font-size: 46px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: 0.02em;
  margin-bottom: 14px;
}

.tagline {
  font-size: 16px;
  color: var(--ink-2);
  max-width: 40em;
}

.meta {
  margin-top: 26px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 10px 28px;
}

.meta a {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink-2);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
  transition: color 0.18s, border-color 0.18s;
}
.meta a:hover { color: var(--hover); border-bottom-color: var(--hover); }

/* ── 双栏 ── */
.cols {
  display: grid;
  grid-template-columns: 7fr 5fr;
  gap: 0 64px;
  align-items: start;
}

.col-left { position: sticky; top: 88px; }

.label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line-2);
  margin-bottom: 6px;
}

/* ── 项目：4 列卡片 ── */
.proj-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px 16px;
}

.proj {
  display: block;
  text-decoration: none;
  color: inherit;
}

.proj-cover {
  aspect-ratio: 16 / 10;
  border-radius: 6px;
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--line);
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.proj-cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.proj-name {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.01em;
  margin-top: 10px;
  line-height: 1.45;
  word-break: break-all;
  transition: color 0.18s;
}

.proj-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
}

.proj:hover .proj-cover { transform: translateY(-3px); border-color: var(--line-2); }
.proj:hover .proj-name { color: var(--hover); }

/* ── 文章列表 ── */
.post {
  display: grid;
  grid-template-columns: 5.5em 1fr;
  gap: 20px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  text-decoration: none;
  color: inherit;
  transition: padding-left 0.2s ease;
}
.post:last-child { border-bottom: none; }

.post-date {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  padding-top: 3px;
  white-space: nowrap;
}

.post-title {
  font-size: 15.5px;
  line-height: 1.6;
}

.post:hover { padding-left: 8px; }
.post:hover .post-title { color: var(--hover); }

/* ── 载入与降级 ── */
.skeleton { padding: 15px 0; border-bottom: 1px solid var(--line); }
.skeleton-bar {
  height: 11px;
  background: var(--line);
  border-radius: 2px;
}
.skeleton-bar.w70 { width: 70%; }

.notice {
  font-size: 14px;
  color: var(--ink-2);
  padding: 15px 0;
}
.notice a { color: var(--hover); }

/* ── 页脚 ── */
footer {
  margin-top: 88px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink-3);
}
footer a { color: var(--ink-3); text-decoration: none; border-bottom: 1px solid var(--line-2); }
footer a:hover { color: var(--hover); }

/* ── 响应式 ── */
@media (max-width: 860px) {
  body { padding: 56px 24px 56px; }
  h1 { font-size: 36px; }
  .masthead { margin-bottom: 52px; }
  .cols { grid-template-columns: 1fr; gap: 52px; }
  .col-left { position: static; }
  .col-posts { order: -1; }
  .post { grid-template-columns: 1fr; gap: 2px; }
  .post-date { padding-top: 0; }
}

@media (max-width: 1080px) {
  .proj-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 700px) {
  .proj-grid { grid-template-columns: repeat(2, 1fr); gap: 20px 14px; }
}

@media (max-width: 480px) {
  body { padding: 40px 18px 44px; }
  h1 { font-size: 30px; }
  .tagline { font-size: 15px; }
  .meta { gap: 8px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="wrap">

<header class="masthead">
  <h1>赵兄休得胡言</h1>
  <p class="tagline">年过四十五，对社会贡献不大；好在还有这片自留地，种点字，留个念想。</p>
  <nav class="meta">
    <a href="https://github.com/ztow">github.com/ztow</a>
    <a href="https://ztow.me/">ztow.me</a>
    <a href="https://ztow.me/feed.xml">rss</a>
  </nav>
</header>

<div class="cols">

<section class="col-left">
  <h2 class="label">项目</h2>

  <div class="proj-grid">

  <a class="proj" href="https://github.com/ztow/genshin-agent-soul">
    <div class="proj-cover"><img src="covers/genshin-agent-soul.svg" alt="" loading="lazy"></div>
    <div class="proj-name">genshin-agent-soul</div>
    <div class="proj-date">2026.04.19</div>
  </a>

  <a class="proj" href="https://github.com/ztow/TrendRader">
    <div class="proj-cover"><img src="covers/TrendRader.svg" alt="" loading="lazy"></div>
    <div class="proj-name">TrendRader</div>
    <div class="proj-date">2026.04.17</div>
  </a>

  <a class="proj" href="https://github.com/ztow/zw-photo-organizer">
    <div class="proj-cover"><img src="covers/zw-photo-organizer.svg" alt="" loading="lazy"></div>
    <div class="proj-name">zw-photo-organizer</div>
    <div class="proj-date">2026.03.11</div>
  </a>

  <a class="proj" href="https://github.com/ztow/life-log">
    <div class="proj-cover"><img src="covers/life-log.svg" alt="" loading="lazy"></div>
    <div class="proj-name">life-log</div>
    <div class="proj-date">2026.07.12</div>
  </a>

  <a class="proj" href="https://github.com/ztow/zipfold">
    <div class="proj-cover"><img src="covers/zipfold.svg" alt="" loading="lazy"></div>
    <div class="proj-name">zipfold</div>
    <div class="proj-date">2026.10.13</div>
  </a>

  </div>
</section>

<section class="col-posts">
  <h2 class="label">近期文章</h2>

  <div id="posts">
    <div class="skeleton"><div class="skeleton-bar w70"></div></div>
    <div class="skeleton"><div class="skeleton-bar"></div></div>
    <div class="skeleton"><div class="skeleton-bar w70"></div></div>
  </div>

  <noscript>
    <p class="notice">文章列表需启用 JavaScript。<a href="https://ztow.me/">前往博客 →</a></p>
  </noscript>
</section>

</div>

<footer>
  <a href="https://github.com/ztow/ztow.github.io">本页源码</a>
</footer>

</div>

<script>
(function () {
  var FEED = 'https://ztow.me/feed.xml';
  var MAX = 10;
  var box = document.getElementById('posts');

  function fmtDate(s) {
    var d = new Date(s);
    if (isNaN(d)) return '';
    var m = '0' + (d.getMonth() + 1);
    var day = '0' + d.getDate();
    return d.getFullYear() + '.' + m.slice(-2) + '.' + day.slice(-2);
  }

  function render(items) {
    box.textContent = '';
    var frag = document.createDocumentFragment();

    items.slice(0, MAX).forEach(function (it) {
      var a = document.createElement('a');
      a.className = 'post';
      a.href = it.link;
      a.target = '_blank';
      a.rel = 'noopener';

      var d = document.createElement('span');
      d.className = 'post-date';
      d.textContent = fmtDate(it.date);

      var t = document.createElement('span');
      t.className = 'post-title';
      t.textContent = it.title;

      a.appendChild(d);
      a.appendChild(t);
      frag.appendChild(a);
    });

    box.appendChild(frag);
  }

  function fail() {
    box.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'notice';
    p.innerHTML = '文章列表加载失败，<a href="https://ztow.me/">前往博客 →</a>';
    box.appendChild(p);
  }

  fetch(FEED)
    .then(function (r) { return r.text(); })
    .then(function (txt) {
      var doc = new DOMParser().parseFromString(txt, 'application/xml');
      var nodes = doc.querySelectorAll('item');
      var items = [];

      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var title = n.querySelector('title');
        var link = n.querySelector('link');
        var date = n.querySelector('pubDate');
        if (!title || !link) continue;
        items.push({
          title: (title.textContent || '').trim(),
          link: (link.textContent || '').trim(),
          date: date ? date.textContent.trim() : ''
        });
      }

      if (!items.length) return fail();
      render(items);
    })
    .catch(fail);
})();
</script>

</body>
</html>
