<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵兄休得胡言</title>
<meta name="description" content="赵伟（ztow）的个人主页与项目索引。">
<style>
:root {
  --bg: #ffffff;
  --text: #1a1a1a;
  --text-2: #5f5e5a;
  --border: rgba(0, 0, 0, 0.1);
  --card: #faf9f7;
  --link: #0a58ca;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0d;
    --text: #e8e6e3;
    --text-2: #9a9892;
    --border: rgba(255, 255, 255, 0.12);
    --card: #161615;
    --link: #7fb2ff;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", sans-serif;
  padding: 72px 24px;
  max-width: 720px;
  margin: 0 auto;
}
h1 { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
.tagline { color: var(--text-2); font-size: 15px; margin-top: 6px; }
section { margin-top: 52px; }
h2 {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
ul { list-style: none; margin-top: 6px; }
li { border-bottom: 1px solid var(--border); }
li:last-child { border-bottom: none; }
a.item {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 14px 2px;
  text-decoration: none;
  color: var(--text);
}
a.item:hover .name { color: var(--link); }
.name { font-size: 15px; font-weight: 500; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.desc { font-size: 14px; color: var(--text-2); flex: 1; }
.star { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.links a {
  font-size: 14px;
  text-decoration: none;
  color: var(--text);
  border: 1px solid var(--border);
  background: var(--card);
  padding: 7px 14px;
  border-radius: 999px;
}
.links a:hover { color: var(--link); border-color: var(--link); }
<footer { margin-top: 64px; font-size: 13px; color: var(--text-2); }
footer a { color: var(--text-2); text-decoration: none; border-bottom: 1px solid var(--border); }
footer a:hover { color: var(--link); }
.posts .title { font-size: 15px; flex: 1; }
.posts .date { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.posts .feed-note { font-size: 13px; color: var(--text-2); margin-top: 12px; }
.posts .feed-note a { color: var(--text-2); text-decoration: none; border-bottom: 1px solid var(--border); }
.posts .feed-note a:hover { color: var(--link); }
@media (max-width: 520px) {
  body { padding: 44px 18px; }
  a.item { flex-wrap: wrap; gap: 4px; }
  .desc { flex-basis: 100%; }
}
</style>
</head>
<body>

<h1>赵兄休得胡言</h1>
<p class="tagline">赵伟 · GitHub 用户名 ztow</p>

<div class="links">
  <a href="https://github.com/ztow">GitHub</a>
  <a href="https://ztow.me/">博客</a>
</div>

<section>
<h2>项目</h2>
<ul>
  <li><a class="item" href="https://github.com/ztow/genshin-agent-soul">
    <span class="name">genshin-agent-soul</span>
    <span class="desc">原神角色人格蒸馏计划，97 个角色人格文件</span>
    <span class="star">★ 4</span>
  </a></li>
  <li><a class="item" href="https://github.com/ztow/TrendRader">
    <span class="name">TrendRader</span>
    <span class="desc">AI 资讯热点聚合与舆情监控</span>
    <span class="star"></span>
  </a></li>
  <li><a class="item" href="https://github.com/ztow/zw-photo-organizer">
    <span class="name">zw-photo-organizer</span>
    <span class="desc">照片自动分类整理</span>
    <span class="star">★ 1</span>
  </a></li>
  <li><a class="item" href="https://github.com/ztow/life-log">
    <span class="name">life-log</span>
    <span class="desc">每日生活记录汇总系统</span>
    <span class="star"></span>
  </a></li>
  <li><a class="item" href="https://github.com/ztow/zipfold">
    <span class="name">zipfold</span>
    <span class="desc">macOS 压缩 / 解压工具，开发中</span>
    <span class="star"></span>
  </a></li>
</ul>
</section>

<section>
<h2>站点</h2>
<ul>
  <li><a class="item" href="https://ztow.me/">
    <span class="name">ztow.me</span>
    <span class="desc">博客</span>
    <span class="star"></span>
  </a></li>
</ul>
</section>

<section>
<h2>近期文章</h2>
<ul class="posts" id="posts">
  <li><a class="item" href="https://ztow.me/"><span class="title">载入中…</span></a></li>
</ul>
<p class="feed-note" id="feed-note">来源 <a href="https://ztow.me/feed.xml">ztow.me/feed.xml</a></p>
</section>

<footer>
  <a href="https://github.com/ztow/ztow.github.io">本页源码</a>
</footer>

<script>
(function () {
  var FEED = 'https://ztow.me/feed.xml';
  var MAX = 5;
  var list = document.getElementById('posts');

  function fmtDate(s) {
    var d = new Date(s);
    if (isNaN(d)) return '';
    return d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2);
  }

  function render(items) {
    list.innerHTML = '';
    items.slice(0, MAX).forEach(function (it) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'item';
      a.href = it.link;
      a.target = '_blank';
      a.rel = 'noopener';
      var t = document.createElement('span');
      t.className = 'title';
      t.textContent = it.title;
      var d = document.createElement('span');
      d.className = 'date';
      d.textContent = fmtDate(it.date);
      a.appendChild(t);
      a.appendChild(d);
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  function fallback() {
    list.innerHTML = '<li><a class="item" href="https://ztow.me/"><span class="title">文章列表加载失败，点此前往博客</span></a></li>';
  }

  fetch(FEED)
    .then(function (r) { return r.text(); })
    .then(function (txt) {
      var doc = new DOMParser().parseFromString(txt, 'application/xml');
      var nodes = doc.querySelectorAll('item');
      var items = [];
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var title = n.querySelector('title');
        var link = n.querySelector('link');
        var date = n.querySelector('pubDate');
        if (!title || !link) continue;
        items.push({
          title: (title.textContent || '').trim(),
          link: (link.textContent || '').trim(),
          date: date ? date.textContent.trim() : ''
        });
      }
      if (!items.length) return fallback();
      render(items);
    })
    .catch(fallback);
})();
</script>

</body>
</html>
